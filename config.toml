[audio]
# Leave empty to use the system default microphone.
# Run `python -c "import sounddevice; print(sounddevice.query_devices())"` to list devices.
# Set to device name (string) or index (integer) for a specific mic.
device = ""
# Ordered preference list, checked before `device`. Entries are case-insensitive
# name substrings or integer indices; the first that matches a connected input
# device is used. Handy for a USB mic that isn't always plugged in:
#   device_priority = ["USB", "default"]
# Empty list (or key absent) keeps the plain `device` setting above.
device_priority = []
sample_rate = 16000
window_seconds = 0.5
# Hotplug recovery: if the active mic stops delivering audio, or delivers only
# pure silence for this many seconds, close the stream and reconnect on the best
# available device. Set to 0 to disable the silence trigger (a full stall is
# always detected). A low-priority ntfy is sent on every loss/recovery/switch.
hotplug_silence_seconds = 60
# While running, re-check device_priority this often so plugging in a
# higher-priority mic switches over without a restart.
device_poll_seconds = 30

[detection]
# Frequency band to watch (Hz). Most smoke detectors beep at 3100-3400 Hz.
freq_low_hz = 3000
freq_high_hz = 3600
# Fraction of total spectral energy that must fall in the band to count as a hit.
energy_ratio_threshold = 0.35
# Alert fires when confirm_windows out of the last confirm_out_of windows are hits.
confirm_windows = 5
confirm_out_of = 8

[recording]
# Save a WAV around every confirmed detection, including a few seconds from
# before the alarm confirmed (rolling pre-buffer). Off by default.
enabled = false
dir = "recordings"
max_files = 50      # oldest files beyond this are deleted
pre_seconds = 5     # audio kept from before the trigger
post_seconds = 10   # audio kept after the trigger

[notification]
# ntfy_topic is loaded from the NTFY_TOPIC environment variable (see .env.example).
# Override for self-hosted ntfy instance.
ntfy_url = "https://ntfy.sh"
cooldown_minutes = 10
power_loss_cooldown_minutes = 30
# Periodic "still alive" ping. Set heartbeat_interval_hours = 0 to disable.
heartbeat_interval_hours = 24
# First heartbeat fires at or after this local time to avoid overnight notifications.
heartbeat_time = "09:00"
